[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".venv-macos-build", "build", "reports", "eval-history"]
extend-include = ["*.spec"]

[tool.ruff.lint.per-file-ignores]
"macos/TrustBench.spec" = ["F821"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
